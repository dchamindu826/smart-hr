name: smarthr_app
description: SmartHR employee app — mark in and out, office or remote.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0   # Flutter 3.32 or newer

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0                     # HTTP, with a queued interceptor for token refresh
  flutter_secure_storage: ^9.2.2  # tokens live here, never in SharedPreferences
  geolocator: ^13.0.2             # location for every punch
  sqflite: ^2.4.1                 # the offline punch queue
  path: ^1.9.0
  uuid: ^4.5.1                    # the clientId that makes retries safe
  connectivity_plus: ^6.1.1       # upload the queue when signal returns
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/icon.png

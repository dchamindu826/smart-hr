name: Build & Deploy iOS App Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store (Xcode 16)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd plan/build/smarthr_app
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd plan/build/smarthr_app/ios
          pod install

      - name: Build iOS Release App
        run: |
          cd plan/build/smarthr_app
          flutter build ios --release --no-codesign --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Setup Apple Signing & Keychain
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'b1a9061f-7ca4-4e00-9190-e492c2bc3b77' }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || 'smarthrpassword2026' }}
        run: |
          node scripts/setup_signing.js

      - name: Codesign and Package App Store IPA
        run: |
          chmod +x scripts/sign_ipa.sh
          ./scripts/sign_ipa.sh

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SmartHR-AppStore-Signed-IPA
          path: plan/build/smarthr_app/build/ios/ipa/SmartHR.ipa
          retention-days: 7

      - name: Upload to App Store Connect / TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: plan/build/smarthr_app/build/ios/ipa/SmartHR.ipa
          issuer-id: 'b1a9061f-7ca4-4e00-9190-e492c2bc3b77'
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

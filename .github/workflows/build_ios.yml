name: Build & Deploy iOS App Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to App Store (Xcode 16)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd plan/build/smarthr_app
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd plan/build/smarthr_app/ios
          pod install

      - name: Install Apple Certificate and Setup Keychain
        env:
          BUILD_CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASS: "temp_signing_pass_2026"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH

          echo "$BUILD_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert_input.bin

          if security import $RUNNER_TEMP/cert_input.bin -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security 2>/dev/null; then
            echo "Imported certificate with password successfully."
          elif security import $RUNNER_TEMP/cert_input.bin -k $KEYCHAIN_PATH -A -T /usr/bin/codesign -T /usr/bin/security; then
            echo "Imported certificate without password successfully."
          else
            echo "Import failed. Checking file format:"
            file $RUNNER_TEMP/cert_input.bin
            exit 1
          fi

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security find-identity -p codesigning $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          cp ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/15f29dec-29e3-41d7-8170-7b3e9203f9af.mobileprovision
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build Signed App Store IPA
        run: |
          cd plan/build/smarthr_app
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find plan/build/smarthr_app/build/ios -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SmartHR-AppStore-Signed-IPA
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 7

      - name: Upload to App Store Connect / TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          issuer-id: 'b1a9061f-7ca4-4e00-9190-e492c2bc3b77'
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

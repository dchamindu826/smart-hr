<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartHR Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002D70; --blue:#0B6FD4; --magenta:#C810B0; --pink:#E40675;
  --paper:#F1F5FA; --card:#FFFFFF; --card-2:#F5F8FC;
  --ink:#062043; --ink-2:#5B7191; --ink-3:#8DA0BA;
  --rule:#E0E7F0; --rule-2:#C7D4E4;
  --ok:#0B8A5C; --ok-bg:#E0F3EB;
  --warn:#A96C08; --warn-bg:#FBEFD6;
  --bad:#BE3220; --bad-bg:#FBE3DE;
  --info:#0B6FD4; --info-bg:#E4EFFC;
  --r:10px; --r-sm:7px; --rail:246px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#050F1F; --card:#0B1D35; --card-2:#112845;
  --ink:#E8EFF8; --ink-2:#93A9C6; --ink-3:#6C83A3;
  --rule:#1A3252; --rule-2:#27476E;
  --blue:#4FA6F8; --magenta:#EE72DA; --pink:#FF69A8;
  --ok:#4CCB92; --ok-bg:#0D3228; --warn:#E0AF59; --warn-bg:#392C11;
  --bad:#F08370; --bad-bg:#3B1B15; --info:#4FA6F8; --info-bg:#102E4C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#050F1F; --card:#0B1D35; --card-2:#112845;
  --ink:#E8EFF8; --ink-2:#93A9C6; --ink-3:#6C83A3;
  --rule:#1A3252; --rule-2:#27476E;
  --blue:#4FA6F8; --magenta:#EE72DA; --pink:#FF69A8;
  --ok:#4CCB92; --ok-bg:#0D3228; --warn:#E0AF59; --warn-bg:#392C11;
  --bad:#F08370; --bad-bg:#3B1B15; --info:#4FA6F8; --info-bg:#102E4C;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo','Noto Sans Sinhala',system-ui,sans-serif;font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Poppins','Noto Sans Sinhala',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--blue)}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--card);border-right:1px solid var(--rule);position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;transition:transform .2s}
.brand{padding:14px 16px 12px;border-bottom:1px solid var(--rule);position:relative}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--pink),var(--magenta) 40%,var(--blue))}
.brand img{width:100%;max-width:196px;height:auto;display:block}
.nav{padding:8px 9px 26px;overflow-y:auto;flex:1}
.nav h2{font-size:10.5px;font-weight:700;color:var(--ink-3);padding:15px 9px 5px;letter-spacing:.05em}
.nav button{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);width:100%;text-align:left;font-size:14px;position:relative;color:var(--ink)}
.nav button:hover{background:var(--card-2)}
.nav button.on{background:var(--info-bg);color:var(--blue);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-9px;top:6px;bottom:6px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.nav .ic{width:16px;text-align:center;flex:none;font-size:13px;opacity:.85}
.nav .ct{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--bad-bg);color:var(--bad);padding:1px 6px;border-radius:9px}
.nav .ct.n{background:var(--card-2);color:var(--ink-2)}
.main{flex:1;min-width:0;margin-left:var(--rail)}

.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:11px;padding:10px 20px;min-height:57px}
.burger{display:none;padding:6px;border-radius:var(--r-sm)}
.burger svg{width:19px;height:19px;display:block}
.pick{position:relative;display:flex}
.pick select{appearance:none;border:1px solid var(--rule-2);background:var(--card);padding:6px 28px 6px 10px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;max-width:min(48vw,260px);cursor:pointer}
.pick::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-4px) rotate(45deg);pointer-events:none}
.top .sp{margin-left:auto}
.tbtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);position:relative}
.tbtn:hover{background:var(--card-2);color:var(--ink)}
.tbtn svg{width:17px;height:17px}
.tbtn .bdg{position:absolute;top:2px;right:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--pink);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.who{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--rule)}
.who b{font-size:13px;font-weight:600;display:block;line-height:1.2}
.who span{font-size:11px;color:var(--ink-2)}
.who i{width:30px;height:30px;border-radius:50%;background:var(--info-bg);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;font-style:normal;flex:none}

.page{padding:20px 20px 60px;max-width:1460px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.ph p{color:var(--ink-2);font-size:13.5px;margin-top:2px;max-width:76ch}
.ph .acts{display:flex;gap:7px;flex-wrap:wrap}

/* atoms */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;border:1px solid var(--rule-2);background:var(--card)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
:root[data-theme="dark"] .btn.pri{color:#04203F}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:5px}
.btn.dgr{color:var(--bad);border-color:var(--bad)}

.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.w{background:var(--warn-bg);color:var(--warn)}
.chip.b{background:var(--bad-bg);color:var(--bad)}
.chip.i{background:var(--info-bg);color:var(--info)}
.chip.law{background:var(--bad-bg);color:var(--bad);border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--rule)}
.card-h h2{font-size:14.5px;font-weight:600}
.card-h .sp{margin-left:auto}
.card-b{padding:14px 15px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card);margin-bottom:14px}
.stat{padding:14px 16px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat b{display:block;font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1}
.stat small{font-size:11.5px;color:var(--ink-2);display:block;margin-top:5px}
.stat.ok b{color:var(--ok)} .stat.w b{color:var(--warn)} .stat.b b{color:var(--bad)} .stat.i b{color:var(--blue)}

table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
thead th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:9px 15px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--card-2)}
tbody td{padding:10px 15px;border-bottom:1px solid var(--rule);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
td.r,th.r{text-align:right}
.emp{display:flex;align-items:center;gap:9px}
.emp i{width:28px;height:28px;border-radius:50%;background:var(--info-bg);color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal;flex:none}
.emp b{display:block;font-weight:600;font-size:13.5px}
.emp span{font-size:11px;color:var(--ink-2)}

.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--rule)}
.ln:last-child{border-bottom:0}
.ln span{color:var(--ink-2)}
.ln b{font-weight:600}
.ln.neg b{color:var(--bad)}
.tot{display:flex;justify-content:space-between;margin-top:9px;padding-top:11px;border-top:2px solid var(--rule-2);font-size:15px;font-weight:700}

.note{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r-sm);font-size:13px;margin-bottom:13px;align-items:flex-start}
.note.w{background:var(--warn-bg);color:var(--warn)}
.note.b{background:var(--bad-bg);color:var(--bad)}
.note.i{background:var(--info-bg);color:var(--info)}
.note.k{background:var(--ok-bg);color:var(--ok)}
.note b{display:block;font-weight:600}
.note .ic{flex:none;font-size:14px;line-height:1.3}

.meter{height:6px;border-radius:3px;background:var(--card-2);border:1px solid var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}

.list-row{display:flex;gap:11px;align-items:flex-start;padding:11px 15px;border-bottom:1px solid var(--rule)}
.list-row:last-child{border-bottom:0}
.list-row .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:var(--ink-3)}
.list-row .dot.ok{background:var(--ok)} .list-row .dot.w{background:var(--warn)} .list-row .dot.b{background:var(--bad)} .list-row .dot.i{background:var(--blue)}
.list-row .bd{flex:1;min-width:0}
.list-row .bd b{display:block;font-size:13.5px;font-weight:600}
.list-row .bd span{font-size:12px;color:var(--ink-2)}
.list-row .rt{flex:none;display:flex;gap:6px;align-items:center}

label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
.f-in{width:100%;padding:8px 10px;border:1px solid var(--rule-2);border-radius:var(--r-sm);background:var(--card);font-size:13.5px}
textarea.f-in{resize:vertical;min-height:62px;font-family:inherit}
.f-row{display:grid;gap:10px}
.f2{grid-template-columns:1fr 1fr}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}

.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg button{padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#04203F}

.empty{padding:44px 20px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px;font-family:'Poppins',sans-serif}

/* steps / wizard */
.steps{display:flex;gap:0;margin-bottom:16px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--rule);border-right:0;background:var(--card);font-size:12.5px;color:var(--ink-2)}
.step:first-child{border-radius:var(--r) 0 0 var(--r)}
.step:last-child{border-right:1px solid var(--rule);border-radius:0 var(--r) var(--r) 0}
.step b{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:1px}
.step.on{background:var(--info-bg);border-color:var(--blue)}
.step.on b{color:var(--blue)}
.step.dn{background:var(--ok-bg)}
.step.dn b{color:var(--ok)}
.step .n{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.7}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--rule)}
.tl-i{position:relative;padding-bottom:15px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--rule-2)}
.tl-i.hi::before{border-color:var(--blue);background:var(--blue)}
.tl-i b{display:block;font-size:13.5px;font-weight:600}
.tl-i span{font-size:12px;color:var(--ink-2)}

/* org chart */
.org{overflow-x:auto;padding:8px 0}
.org-l{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;min-width:min-content;margin-bottom:24px;position:relative}
.org-n{border:1px solid var(--rule);background:var(--card);border-radius:var(--r-sm);padding:9px 12px;min-width:132px;text-align:center;position:relative}
.org-n b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}
.org-n span{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.org-n.hd{border-color:var(--blue);background:var(--info-bg)}
.org-l::after{content:"";position:absolute;left:50%;bottom:-13px;width:1px;height:13px;background:var(--rule-2)}
.org-l:last-child::after{display:none}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kb-c{background:var(--card-2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:9px;min-width:160px}
.kb-c h3{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between}
.kb-i{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 9px;margin-bottom:6px}
.kb-i b{display:block;font-size:12.5px;font-weight:600}
.kb-i span{font-size:10.5px;color:var(--ink-2)}

/* toast + sheet */
/* roster cells */
.rcell{border-radius:6px;padding:5px 7px;font-size:11.5px;line-height:1.35;min-width:104px}
.rcell b{display:block;font-size:12px;font-weight:600}
.rcell span{color:var(--ink-2);display:block}
.rcell .mode{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:10.5px;font-weight:600}
.rcell.office{background:var(--info-bg)}
.rcell.office .mode{color:var(--info)}
.rcell.wfh{background:var(--ok-bg)}
.rcell.wfh .mode{color:var(--ok)}
.rcell.split{background:linear-gradient(105deg,var(--info-bg) 0 48%,var(--ok-bg) 48% 100%)}
.rcell.off{background:var(--card-2);color:var(--ink-3)}
.rcell.hol{background:var(--warn-bg);color:var(--warn)}
.rcell.bad{outline:2px solid var(--bad);outline-offset:-2px}

/* approval strip */
.appr{display:flex;gap:0;margin-bottom:14px;flex-wrap:wrap}
.appr-s{flex:1;min-width:150px;padding:11px 13px;border:1px solid var(--rule);border-right:0;background:var(--card);font-size:12px;color:var(--ink-2)}
.appr-s:first-child{border-radius:var(--r) 0 0 var(--r)}
.appr-s:last-child{border-right:1px solid var(--rule);border-radius:0 var(--r) var(--r) 0}
.appr-s b{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:1px}
.appr-s.dn{background:var(--ok-bg);border-color:transparent}
.appr-s.dn b{color:var(--ok)}
.appr-s.now{background:var(--info-bg);border-color:var(--blue)}
.appr-s.now b{color:var(--blue)}
.appr-s .who{font-size:10.5px;opacity:.85;border:0;padding:0;margin-top:2px;display:block}

/* session rows */
tr.sess td{background:var(--card-2);font-size:12.5px;padding-top:7px;padding-bottom:7px;color:var(--ink-2);border-bottom:1px dashed var(--rule)}
tr.sess td:first-child{padding-left:38px;position:relative}
tr.sess td:first-child::before{content:"↳";position:absolute;left:20px;color:var(--ink-3)}
tr.sess.last td{border-bottom:1px solid var(--rule)}
.exp{width:20px;height:20px;border-radius:4px;border:1px solid var(--rule-2);display:inline-grid;place-items:center;font-size:11px;color:var(--ink-2);margin-right:7px;vertical-align:middle;line-height:1}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px}
.mchip.o{background:var(--info-bg);color:var(--info)}
.mchip.w{background:var(--ok-bg);color:var(--ok)}

/* pay calendar */
.pc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.pc-h{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);padding-bottom:4px}
.pc-d{border:1px solid var(--rule);border-radius:7px;padding:7px 8px;min-height:74px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:3px}
.pc-d:hover{border-color:var(--ink-3)}
.pc-d .n{font-size:13px;font-weight:600}
.pc-d .t{font-size:10.5px;line-height:1.25;color:var(--ink-2)}
.pc-d .x{margin-top:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;align-self:flex-start}
.pc-d.pad{border-color:transparent;background:transparent;min-height:0}
.pc-d.wk{background:var(--card-2)}
.pc-d.half{background:var(--card-2)}
.pc-d.poya{background:var(--warn-bg);border-color:transparent}
.pc-d.poya .n,.pc-d.poya .t{color:var(--warn)}
.pc-d.pub{background:var(--bad-bg);border-color:transparent}
.pc-d.pub .n,.pc-d.pub .t{color:var(--bad)}
.pc-d.co{background:var(--info-bg);border-color:transparent}
.pc-d.co .n,.pc-d.co .t{color:var(--info)}
.pc-d.sel{outline:2px solid var(--blue);outline-offset:-2px}
.x2{background:var(--bad);color:#fff}
.x15{background:var(--warn);color:#fff}
.x1{background:var(--rule-2);color:var(--ink-2)}

/* payslip designer */
.slipwrap{background:var(--card-2);border:1px solid var(--rule);border-radius:var(--r);padding:18px;overflow-x:auto}
.slip{background:#fff;color:#14203a;width:640px;max-width:100%;margin:0 auto;padding:26px 28px;
  border-radius:3px;box-shadow:0 2px 14px rgba(10,25,50,.14);font-size:12px;line-height:1.45}
.slip *{border-color:#d8dfe9}
.slip-top{display:flex;gap:14px;align-items:flex-start;border-bottom:2px solid #14203a;padding-bottom:13px;margin-bottom:14px}
.slip-top img{width:112px;height:auto;flex:none}
.slip-co{flex:1;min-width:0}
.slip-co b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.slip-co span{display:block;font-size:11px;color:#5d6d85;margin-top:2px}
.slip-ttl{text-align:right;flex:none}
.slip-ttl b{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.slip-ttl span{font-size:11px;color:#5d6d85}
.slip-meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-bottom:14px}
.slip-meta div{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0}
.slip-meta span{color:#5d6d85}
.slip-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-bottom:12px}
.slip-cols h4{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:#5d6d85;border-bottom:1px solid #d8dfe9;padding-bottom:4px;margin-bottom:5px}
.slip-r{display:flex;justify-content:space-between;padding:2.5px 0;font-size:11.5px}
.slip-r.sum{border-top:1px solid #d8dfe9;margin-top:4px;padding-top:5px;font-weight:700}
.slip-net{display:flex;justify-content:space-between;align-items:center;background:#eef3fa;border:1px solid #d8dfe9;border-radius:4px;padding:11px 14px;margin-bottom:12px}
.slip-net span{font-size:11.5px;color:#5d6d85;display:block}
.slip-net b{font-size:12.5px;font-weight:700;display:block}
.slip-net .amt{font-size:21px;font-weight:700;letter-spacing:-.02em}
.slip-x{border-top:1px solid #d8dfe9;padding-top:9px;margin-bottom:9px}
.slip-x h4{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:#5d6d85;margin-bottom:4px}
.slip-x p{font-size:11px;color:#3d4b63}
.slip-foot{border-top:1px solid #d8dfe9;padding-top:9px;font-size:10px;color:#7a89a0;text-align:center}
.slip[data-lang="si"]{font-family:'Noto Sans Sinhala','Archivo',sans-serif}
.slip.center .slip-top{flex-direction:column;align-items:center;text-align:center}
.slip.center .slip-ttl{text-align:center}
.tgl{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px;cursor:pointer}
.tgl:last-child{border-bottom:0}
.tgl input{width:16px;height:16px;accent-color:var(--blue);flex:none;cursor:pointer}
.tgl span{flex:1}
.tgl small{color:var(--ink-3);font-size:11px}

/* plan tiers */
.tier{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 17px;display:flex;flex-direction:column}
.tier.on{border-color:var(--blue);border-width:2px;padding:15px 16px}
.tier h3{font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;letter-spacing:-.02em}
.tier .sz{font-size:12px;color:var(--ink-2);margin-top:1px}
.tier .pr{font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;margin:11px 0 1px;line-height:1}
.tier .pr small{font-size:12.5px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.tier ul{list-style:none;padding:0;margin:12px 0 0;font-size:13px;color:var(--ink-2);flex:1}
.tier li{padding:3px 0 3px 17px;position:relative}
.tier li::before{content:"\2713";position:absolute;left:0;color:var(--ok);font-weight:700;font-size:11px}
.tier li.no{color:var(--ink-3)}
.tier li.no::before{content:"\2013";color:var(--ink-3)}
.tier .cnt{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
.tier .cnt b{color:var(--ink);font-weight:600}
#nav button.dim{opacity:.32}
#nav button.dim .ct{display:none}

.toasts{position:fixed;bottom:16px;right:16px;z-index:80;display:flex;flex-direction:column;gap:7px;max-width:340px}
.toast{background:var(--ink);color:var(--paper);padding:10px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;animation:ti .2s ease}
@keyframes ti{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(4,17,38,.5);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--rule);z-index:51;transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);overflow-y:auto;padding:18px 20px 40px}
.sheet.on{transform:none}
.sheet h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.sheet .x{position:absolute;top:14px;right:16px;font-size:20px;color:var(--ink-2);line-height:1}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.gmain{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
@media (max-width:900px){
  .rail{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .main{margin-left:0}
  .burger{display:grid;place-items:center}
  .who b,.who span{display:none}
  .page{padding:16px 13px 50px}
  .top{padding:9px 13px}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:620px){.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--rule)}.stat:last-child{border-bottom:0}.g4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

window.AFTER.payslip=function(){
  var slip=document.getElementById('slip');
  var logo=document.getElementById('s-logo');

  function bind(inputId, targetId){
    var i=document.getElementById(inputId), t=document.getElementById(targetId);
    i.addEventListener('input',function(){ t.textContent=i.value; });
  }
  bind('bd-n','s-name'); bind('bd-a','s-addr'); bind('bd-r','s-reg');
  bind('bd-c','s-contact'); bind('bd-t','s-title');
  document.getElementById('ft-t').addEventListener('input',function(){
    document.getElementById('s-foot').textContent=this.value;
  });

  document.querySelectorAll('[data-sec]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var el=document.getElementById(cb.getAttribute('data-sec'));
      if(cb.getAttribute('data-sec')==='s-bank'){ el.parentNode.hidden=!cb.checked; }
      else { el.hidden=!cb.checked; }
    });
  });

  var f=document.getElementById('lg-f');
  f.addEventListener('change',function(){
    var file=f.files && f.files[0]; if(!file) return;
    var r=new FileReader();
    r.onload=function(e){ logo.src=e.target.result; logo.hidden=false; __toast('Logo added to the template.'); };
    r.onerror=function(){ __toast('That file could not be read. Try a PNG or JPG.'); };
    r.readAsDataURL(file);
  });
  document.getElementById('lg-sample').addEventListener('click',function(){
    var src=document.querySelector('.brand img');
    if(src){ logo.src=src.src; logo.hidden=false; __toast('Sample logo placed.'); }
  });
  document.getElementById('lg-clear').addEventListener('click',function(){
    logo.hidden=true; logo.removeAttribute('src'); __toast('Logo removed.');
  });
  document.getElementById('lg-pos').addEventListener('change',function(){
    slip.classList.toggle('center', this.value==='center');
  });
  document.getElementById('lg-w').addEventListener('input',function(){
    logo.style.width=this.value+'px';
  });

  document.getElementById('slipLang').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    var l=b.getAttribute('data-l');
    slip.setAttribute('data-lang',l);
    var T={
      en:['PAY SLIP','Basic salary','Budgetary relief allowance','Attendance allowance','EARNINGS','DEDUCTIONS','NET PAY'],
      si:['වැටුප් පත්‍රිකාව','මූලික වැටුප','අල්ලස් සහන දීමනාව','පැමිණීම් දීමනාව','ඉපැයීම්','අඩු කිරීම්','ශුද්ධ වැටුප'],
      ta:['சம்பள சீட்டு','அடிப்படை சம்பளம்','பட்ஜெட் \u0ba8\u0bbf\u0bb5\u0bbe\u0bb0\u0ba3 படி','வருகை படி','வருமானம்','கழிவுகள்','நிகர சம்பளம்']
    }[l];
    document.getElementById('s-title').textContent=T[0];
    var rows=slip.querySelectorAll('.slip-cols .slip-r span:first-child');
    rows[0].textContent=T[1]; rows[2].textContent=T[2]; rows[4].textContent=T[3];
    var h=slip.querySelectorAll('.slip-cols h4');
    h[0].textContent=T[4]; h[1].textContent=T[5];
    slip.querySelector('.slip-net span').textContent=T[6];
    document.getElementById('slipLang').querySelectorAll('button').forEach(function(o){
      o.setAttribute('aria-pressed', String(o===b));
    });
    document.getElementById('bd-t').value=T[0];
  });
};
